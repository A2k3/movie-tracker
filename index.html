<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Movie Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header>
      <h1>My Movie Tracker</h1>
      <p class="subtitle">Keep a record. Find something to watch tonight.</p>
    </header>

    <form id="movie-form">
  <input type="text" id="title" placeholder="Movie title (add year in brackets if needed, e.g. Dune (2021))" required>
  <button type="submit">Add Movie</button>
</form>

    <div class="suggest-box">
      <select id="genre-select">
        <option value="">Suggest by genre...</option>
      </select>
      <button id="suggest-btn" type="button">Suggest a Movie</button>
      <p id="suggestion-result"></p>
    </div>

    <div class="section-label">To Watch</div>
<div id="movie-list"></div>

<div class="section-label">Watched</div>
<div id="watched-list"></div>

  </div>


  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD93UpZoTGh5NMesjJjP3KzCGBve4bUXsc",
      authDomain: "movie-tracker-eb0ab.firebaseapp.com",
      projectId: "movie-tracker-eb0ab",
      storageBucket: "movie-tracker-eb0ab.firebasestorage.app",
      messagingSenderId: "745708066749",
      appId: "1:745708066749:web:cac524f4122b80377c24d4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.fb = { collection, addDoc, getDocs, deleteDoc, updateDoc, doc };
  </script>

  <script src="script.js"></script>
</body>
</html>
